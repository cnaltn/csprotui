name: Publish to npm

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'npm/csprotui/**'
      - 'scraper/**'
      - '.github/workflows/npm-publish.yml'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy scraper to npm package
        run: |
          cp -r scraper npm/csprotui/scraper
          rm -rf npm/csprotui/scraper/node_modules

      - name: Inject URL into cli.js
        run: |
          ENCODED=$(echo -n "${{ vars.CSPROTUI_BASE_URL }}" | base64 -w0)
          sed -i "s|__ENCODED_URL__|${ENCODED}|g" npm/csprotui/cli.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync version from tag
        working-directory: npm/csprotui
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: npm/csprotui
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
